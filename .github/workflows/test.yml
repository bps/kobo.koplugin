name: Test

on:
  push:
    branches:
      - "main"
  pull_request:

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      test_changed: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            **/*.lua
            spec/**/*_spec.lua
            test/**
            .busted
            .github/workflows/test.yml

  native-integration:
    name: Native integration tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.test_changed == 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Check out pinned KOReader runtime APIs
        uses: actions/checkout@v6
        with:
          repository: koreader/koreader-base
          ref: cd173c179a56b42ddbf06b6ac3eafec099ffe219
          path: .native-runtime/koreader-base
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit lua-filesystem libarchive-dev libsqlite3-dev
      - name: Run tests without the unit-test mocks
        env:
          KOREADER_BASE: ${{ github.workspace }}/.native-runtime/koreader-base
        run: bash test/run-integration.bash

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.test_changed == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install LuaJIT
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "luajit-2.1"

      - name: Install LuaRocks
        uses: leafo/gh-actions-luarocks@v6

      - name: Install busted
        run: |
          luarocks install busted
          luarocks install luacov

      - name: Run tests with coverage
        run: busted spec/

      - name: Generate coverage report
        run: |
          if [ -f luacov.stats.out ]; then
            luacov
            echo "Coverage report:"
            cat luacov.report.out || true
          fi
